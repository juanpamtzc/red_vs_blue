name: Python CI Pipeline

# 1. TRIGGER: When does this run?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. JOBS: What isolated computer should GitHub spin up?
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step A: Download your code onto the GitHub server
    - name: Check out repository code
      uses: actions/checkout@v4

    # Step B: Install a fresh version of Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # Step C: Install your math tools and pytest
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Step D: Run the test suite
    - name: Run unit tests with pytest
      run: |
        pytest tests/